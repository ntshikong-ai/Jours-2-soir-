text:`Dans toute préparation sérieuse à une épreuve exigeante, la quantité de travail constitue un élément important, mais elle ne suffit pas à expliquer les différences de progression entre deux candidats. Deux élèves peuvent consacrer un nombre identique d'heures à leurs révisions et pourtant obtenir des résultats très différents. L'un peut passer plusieurs heures à relire ses notes tandis que l'autre consacre une partie de son temps à résoudre des problèmes, à répondre à des questions sans regarder son cours et à analyser systématiquement ses erreurs.

Cette différence repose en partie sur la nature de l'effort fourni. La relecture donne souvent une impression de familiarité : une définition paraît évidente parce qu'elle a déjà été rencontrée plusieurs fois. Pourtant, lorsqu'il faut restituer cette définition sans support ou l'utiliser dans une situation nouvelle, la difficulté peut réapparaître. La récupération active des connaissances permet précisément de mesurer ce que l'on sait réellement.

La correction joue également un rôle déterminant. Une erreur ne constitue pas seulement une perte de points ; elle peut révéler une lacune précise. Un candidat peut avoir confondu deux notions, mal interprété une consigne, appliqué une règle dans un contexte où elle ne convient pas ou répondu trop rapidement. Ces causes ne se corrigent pas de la même manière. Il est donc plus utile d'identifier la nature de l'erreur que de se contenter de mémoriser la réponse correcte.

La difficulté augmente encore lorsque les questions deviennent proches les unes des autres. Dans un examen sélectif, plusieurs propositions peuvent sembler plausibles. La différence entre elles repose parfois sur un seul mot, une condition, un temps verbal ou une relation logique. La lecture attentive de la consigne devient alors une compétence à part entière. Répondre vite peut être utile lorsque le temps est limité, mais la vitesse ne doit pas remplacer la précision.

La régularité constitue enfin un facteur essentiel. Une séance exceptionnelle de plusieurs heures peut être impressionnante, mais elle ne garantit pas une mémorisation durable. Des séances répétées permettent de réactiver progressivement les connaissances et de revenir sur les notions qui résistent. L'objectif n'est donc pas de travailler constamment, mais d'organiser le travail de manière à rendre chaque séance réellement productive.

Cette méthode exige une certaine honnêteté intellectuelle. Il faut accepter de constater qu'une notion que l'on croyait maîtriser ne l'est pas encore. Il faut également résister à la tentation de sélectionner uniquement les exercices faciles. Les difficultés signalent souvent les domaines dans lesquels l'amélioration peut être la plus importante.

Ainsi, une préparation efficace associe plusieurs éléments : compréhension, récupération active, entraînement, correction, répétition et gestion du temps. Aucun de ces éléments ne remplace complètement les autres. C'est leur combinaison qui transforme progressivement une connaissance fragile en compétence utilisable dans une situation nouvelle.`

text:`Learning a foreign language requires more than knowing a collection of grammatical rules. Grammar provides a framework, but learners must also develop the ability to recognize structures, produce sentences and understand meaning in different situations. This ability usually develops gradually rather than appearing immediately after a rule has been studied.

One reason progress can seem slow is that understanding and automatic use are different. A student may correctly explain the difference between the present perfect and the past simple but still hesitate when choosing between them in a conversation. This does not necessarily mean that the rule has been forgotten. It may simply mean that the learner has not yet practised it enough in meaningful contexts.

Active practice can help reduce this gap. Instead of reading a list of examples repeatedly, learners can attempt to create their own sentences, answer questions without looking at the solution and then compare their answers with a reliable correction. The effort required to retrieve information is useful because it shows whether the learner can actually produce the language independently.

Mistakes are another important part of the process. A learner who notices a repeated error can investigate its cause. Perhaps the problem is an incorrect verb form; perhaps a preposition has been confused with another one; perhaps the learner has transferred a structure from the first language. Once the cause is identified, practice can become more focused.

Regular exposure is also valuable. Ten or twenty minutes of concentrated practice on a regular basis may be easier to maintain than a very long session followed by several days without contact with the language. Regular practice provides repeated opportunities to meet familiar words and structures in new contexts.

Finally, effective learners do not expect perfection at every stage. They understand that competence develops through cycles of learning, attempting, making mistakes, correcting and trying again. Progress is therefore not always visible from one day to the next, but consistent practice gradually changes what feels difficult into something more automatic.`

/* =========================================================
   VERIFICATION AUTOMATIQUE
========================================================= */

if(QUESTIONS.length !== 100){
    alert("Erreur : le test doit contenir exactement 100 questions.");
    throw new Error("QUESTIONS != 100");
}

for(let q of QUESTIONS){
    if(
        !q.question ||
        !Array.isArray(q.options) ||
        q.options.length !== 4 ||
        q.answer < 0 ||
        q.answer > 3
    ){
        throw new Error("Question mal configurée.");
    }
}


/* =========================================================
   VARIABLES
========================================================= */

let questions = [];
let current = 0;
let answers = [];
let candidate = "";

let interval = null;
let remaining = 60;

let readingInterval = null;
let readingRemaining = 900;

let readingDone = {
    Français:false,
    English:false
};


/* =========================================================
   OUTILS
========================================================= */

function $(id){
    return document.getElementById(id);
}

function show(id){
    ["home","reading","quiz","results"].forEach(x=>{
        $(x).classList.add("hidden");
    });
    $(id).classList.remove("hidden");
}

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}


/* =========================================================
   PREPARATION
========================================================= */

function prepareQuestions(){

    questions = QUESTIONS.map((q,index)=>{

        let choices=q.options.map((text,index)=>({
            text:text,
            original:index
        }));

        shuffle(choices);

        return {
            ...q,
            choices:choices,
            originalIndex:index
        };

    });

    answers=Array(100).fill(null);
}


/* =========================================================
   DEMARRAGE
========================================================= */

$("startBtn").onclick=function(){

    candidate=$("candidateName").value.trim();

    if(!candidate){
        alert("Veuillez entrer votre nom et postnom.");
        return;
    }

    prepareQuestions();

    current=0;

    readingDone={
        Français:false,
        English:false
    };

    showQuizOrReading();
};


/* =========================================================
   ROUTAGE
========================================================= */

function showQuizOrReading(){

    let q=questions[current];

    if(
        q.text &&
        (q.subject==="Français" || q.subject==="English") &&
        !readingDone[q.subject]
    ){
        startReading(q.subject,q.text);
        return;
    }

    renderQuestion();
}


/* =========================================================
   LECTURE
========================================================= */

function startReading(subject,text){

    clearInterval(interval);
    clearInterval(readingInterval);

    show("reading");

    $("readingTitle").textContent=
        subject==="Français"
        ?"Lecture — Français"
        :"Reading — English";

    $("readingText").textContent=text;

    readingRemaining=900;

    updateReadingTimer();

    readingInterval=setInterval(()=>{

        readingRemaining--;

        updateReadingTimer();

        if(readingRemaining<=0){

            clearInterval(readingInterval);

            readingDone[subject]=true;

            renderQuestion();
        }

    },1000);

    $("skipReading").onclick=function(){

        clearInterval(readingInterval);

        readingDone[subject]=true;

        renderQuestion();

    };
}

function updateReadingTimer(){

    let min=Math.floor(readingRemaining/60);
    let sec=readingRemaining%60;

    $("readingTimer").textContent=
        String(min).padStart(2,"0")
        +":"
        +String(sec).padStart(2,"0");
}


/* =========================================================
   QUESTION
========================================================= */

function renderQuestion(){

    clearInterval(readingInterval);
    clearInterval(interval);

    show("quiz");

    let q=questions[current];

    $("questionNumber").textContent=
        "Question "+(current+1)+" / 100";

    $("subject").textContent=q.subject;

    $("questionText").textContent=q.question;

    $("progressFill").style.width=
        ((current+1)/100*100)+"%";

    $("options").innerHTML="";

    q.choices.forEach((choice,index)=>{

        let button=document.createElement("button");

        button.className="option";

        if(answers[current]===choice.original){
            button.classList.add("selected");
        }

        button.textContent=
            String.fromCharCode(65+index)
            +". "
            +choice.text;

        button.onclick=function(){

            answers[current]=choice.original;

            renderOptions();

            renderNavigation();
        };

        $("options").appendChild(button);

    });

    renderNavigation();

    startQuestionTimer();
}


/* =========================================================
   REPONSE
========================================================= */

function renderOptions(){

    let q=questions[current];

    [...$("options").children].forEach((button,index)=>{

        button.classList.toggle(
            "selected",
            answers[current]===q.choices[index].original
        );

    });
}


/* =========================================================
   TIMER QUESTION
========================================================= */

function startQuestionTimer(){

    clearInterval(interval);

    remaining=60;

    updateQuestionTimer();

    interval=setInterval(()=>{

        remaining--;

        updateQuestionTimer();

        if(remaining<=0){

            clearInterval(interval);

            nextQuestion();

        }

    },1000);
}

function updateQuestionTimer(){

    $("questionTimer").textContent=
        "00:"+String(remaining).padStart(2,"0");
}


/* =========================================================
   NAVIGATION
========================================================= */

function nextQuestion(){

    clearInterval(interval);

    if(current<99){

        current++;

        showQuizOrReading();

    }else{

        finishTest();

    }
}

$("nextBtn").onclick=nextQuestion;


$("previousBtn").onclick=function(){

    clearInterval(interval);

    if(current>0){

        current--;

        showQuizOrReading();

    }

};


function renderNavigation(){

    $("questionNavigation").innerHTML="";

    questions.forEach((q,index)=>{

        let button=document.createElement("button");

        button.className="qbtn";

        if(answers[index]!==null){
            button.classList.add("done");
        }

        if(index===current){
            button.classList.add("current");
        }

        button.textContent=index+1;

        button.onclick=function(){

            clearInterval(interval);

            current=index;

            showQuizOrReading();

        };

        $("questionNavigation").appendChild(button);

    });

}


/* =========================================================
   TEXTE
========================================================= */

$("textBtn").onclick=function(){

    let q=questions[current];

    if(!q.text){

        alert("Cette question ne dépend pas d'un texte.");

        return;
    }

    $("modalTitle").textContent=
        q.subject==="Français"
        ?"Texte français"
        :"English text";

    $("modalText").textContent=q.text;

    $("textModal").style.display="flex";
};

$("closeModal").onclick=function(){
    $("textModal").style.display="none";
};

$("textModal").onclick=function(e){

    if(e.target===$("textModal")){
        $("textModal").style.display="none";
    }

};


/* =========================================================
   RESULTATS
========================================================= */

function finishTest(){

    clearInterval(interval);
    clearInterval(readingInterval);

    let score=0;

    let subjectScore={
        "Culture générale":[0,0],
        "Français":[0,0],
        "English":[0,0],
        "Maths":[0,0]
    };

    let errorHTML="";

    questions.forEach((q,index)=>{

        let correct=
            answers[index]===q.answer;

        subjectScore[q.subject][1]++;

        if(correct){

            score++;

            subjectScore[q.subject][0]++;

        }else{

            let chosen="Aucune réponse";

            if(answers[index]!==null){

                let found=q.choices.find(
                    c=>c.original===answers[index]
                );

                if(found){
                    chosen=found.text;
                }

            }

            errorHTML+=`

            <div class="error">

                <b>Question ${index+1}</b>

                <p>${q.question}</p>

                <p>
                    <b>Ta réponse :</b>
                    ${chosen}
                </p>

                <p>
                    <b>Bonne réponse :</b>
                    ${q.options[q.answer]}
                </p>

            </div>

            `;

        }

    });


    show("results");

    $("finalScore").textContent=
        candidate+
        " : "+
        score+
        "/100 — "+
        score+
        "%";


    $("subjectScores").innerHTML="";

    Object.keys(subjectScore).forEach(subject=>{

        let data=subjectScore[subject];

        let badge=document.createElement("span");

        badge.className="badge";

        badge.textContent=
            subject+
            " : "+
            data[0]+"/"+
            data[1];

        $("subjectScores").appendChild(badge);

    });


    $("errors").innerHTML=
        errorHTML ||
        "<p>Aucune erreur. Score parfait : 100/100.</p>";

}

</script>
