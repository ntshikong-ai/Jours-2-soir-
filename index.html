const FRENCH_TEXT = `Dans une préparation sérieuse, la difficulté ne vient pas seulement de la quantité de connaissances à retenir. Elle vient aussi de la capacité à mobiliser ces connaissances au moment précis où une situation l'exige. Un candidat peut connaître une définition, une règle de grammaire ou une formule mathématique et pourtant échouer à l'utiliser correctement. La connaissance isolée doit donc progressivement devenir une compétence.

La première étape consiste à comprendre. Comprendre une notion signifie être capable de l'expliquer avec ses propres mots, de distinguer ce qui la caractérise de ce qui lui ressemble et de reconnaître les situations dans lesquelles elle s'applique. Une mémorisation purement mécanique peut être utile pour certains éléments, notamment les dates, les formes verbales ou certaines définitions, mais elle devient insuffisante lorsque la question exige une comparaison, une déduction ou l'identification d'une nuance.

La deuxième étape est l'entraînement. Répondre à une question sans regarder la solution oblige l'esprit à récupérer l'information. Cette récupération est plus exigeante qu'une simple relecture, mais elle révèle beaucoup mieux les connaissances réellement disponibles. Lorsqu'une réponse est fausse, la correction ne devrait pas se limiter à donner la bonne proposition. Il faut chercher la cause de l'erreur : confusion entre deux notions, mauvaise lecture de la consigne, calcul précipité, oubli d'une condition ou application d'une règle dans un contexte inadapté.

La troisième étape est la répétition espacée. Une notion que l'on vient d'étudier paraît souvent facile. Quelques jours plus tard, elle peut sembler moins accessible. Cette difficulté n'est pas nécessairement un signe d'échec ; elle peut être l'occasion de renforcer la récupération de l'information. Revenir plusieurs fois sur une notion, avec des exercices différents, permet de construire des connaissances plus résistantes.

La gestion du temps constitue une autre dimension de la préparation. Dans un examen sélectif, toutes les questions ne demandent pas le même effort. Certaines vérifient une connaissance directe ; d'autres exigent plusieurs étapes de raisonnement. Le candidat doit donc apprendre à lire rapidement sans devenir superficiel. Une réponse donnée en quelques secondes n'est pas forcément une bonne réponse, tout comme une réponse longuement réfléchie n'est pas forcément exacte. L'objectif est de consacrer à chaque question un temps proportionné à sa difficulté.

Enfin, l'erreur doit être transformée en information. Celui qui note uniquement son score connaît son résultat, mais pas nécessairement la cause de ses difficultés. Celui qui classe ses erreurs par nature — vocabulaire, conjugaison, raisonnement, calcul, géographie, histoire ou lecture — peut identifier des tendances et adapter son travail. Cette démarche exige de l'honnêteté : il faut accepter de revoir les notions que l'on croyait maîtriser.

Une préparation efficace n'est donc pas une simple accumulation d'heures. Elle associe compréhension, récupération active, entraînement, correction, répétition et gestion du temps. À long terme, cette méthode permet non seulement de mieux répondre aux questions d'un examen, mais aussi de développer une capacité générale à apprendre, à vérifier une information et à raisonner avec précision.`;

const ENGLISH_TEXT = `Learning effectively is not simply a matter of spending more hours with a book. Time is important, but the way that time is used can determine whether knowledge becomes durable or disappears after a few days. A learner who reads the same page repeatedly may feel that the material has become familiar. However, familiarity is not always the same as the ability to recall and use information independently.

Active recall is one way of testing real understanding. Instead of looking at a definition and immediately moving on, the learner can close the book and attempt to explain the concept from memory. In a language class, this may mean producing a sentence with a new word or choosing the correct tense without checking the rule first. The effort involved in retrieving information can reveal gaps that passive reading often hides.

Mistakes are also valuable when they are examined carefully. A student may repeatedly use the wrong tense because the difference between two time references is unclear. Another student may know the rule but make mistakes because of speed or lack of attention. These problems require different solutions. Memorizing the same rule again will not necessarily solve an error caused by careless reading.

Regular practice is another important factor. Short, concentrated sessions can be easier to maintain than occasional periods of very intensive work. Regular exposure also gives learners repeated opportunities to encounter the same structure in different contexts. A grammatical form that seems abstract in a lesson can become easier to understand when it appears in a story, a conversation or a practical situation.

Good preparation also requires a willingness to work on difficult material. It is tempting to repeat exercises that are already easy because success feels reassuring. Yet difficult questions often reveal the boundaries of one's current knowledge. Working on them, checking the correction and trying again can gradually move those boundaries.

Finally, effective learners understand that progress is rarely perfectly linear. There may be days when a familiar idea seems difficult and other days when a previously difficult structure becomes automatic. What matters is the general direction created by consistent practice. Learning is a process of understanding, attempting, correcting and attempting again.`;

/* =========================================================
   VERIFICATION AVANT DEMARRAGE
========================================================= */

if(Q.length !== 100){
    alert(
        "ERREUR : le test contient "
        + Q.length
        + " questions au lieu de 100."
    );

    throw new Error("Nombre de questions incorrect.");
}

const counts={
    "Culture générale":0,
    "Français":0,
    "English":0,
    "Maths":0
};

Q.forEach(q=>{

    counts[q.s]++;

    if(
        !q.q ||
        !Array.isArray(q.o) ||
        q.o.length!==4 ||
        q.a<0 ||
        q.a>3
    ){
        throw new Error("Question mal configurée.");
    }

});

if(
    counts["Culture générale"]!==25 ||
    counts["Français"]!==25 ||
    counts["English"]!==25 ||
    counts["Maths"]!==25
){
    throw new Error(
        "Chaque matière doit contenir exactement 25 questions."
    );
}


/* =========================================================
   VARIABLES
========================================================= */

let order=[];
let answers=[];
let current=0;

let timer=null;
let readingTimer=null;

let remaining=60;
let readRemaining=900;

let name="";

let readDone={
    Français:false,
    English:false
};


/* =========================================================
   OUTILS
========================================================= */

const $=id=>document.getElementById(id);


function show(id){

    [
        "home",
        "reading",
        "quiz",
        "results"
    ].forEach(x=>{
        $(x).classList.add("hidden");
    });

    $(id).classList.remove("hidden");
}


function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        let j=Math.floor(
            Math.random()*(i+1)
        );

        [
            array[i],
            array[j]
        ]=[
            array[j],
            array[i]
        ];
    }

    return array;
}


/* =========================================================
   PREPARATION
========================================================= */

function prepare(){

    order=Q.map((q,n)=>({

        ...q,

        index:n,

        choices:shuffle(
            q.o.map((text,k)=>({
                text:text,
                k:k
            }))
        )

    }));

    answers=Array(100).fill(null);
}


/* =========================================================
   DEMARRAGE
========================================================= */

$("start").onclick=()=>{

    name=$("name").value.trim();

    if(!name){

        alert(
            "Entre ton nom et postnom."
        );

        return;
    }

    prepare();

    current=0;

    readDone={
        Français:false,
        English:false
    };

    route();
};


/* =========================================================
   ROUTAGE
========================================================= */

function route(){

    let q=order[current];

    if(
        q.r &&
        !readDone[q.s]
    ){

        startReading(
            q.s,
            q.r
        );

        return;
    }

    render();
}


/* =========================================================
   LECTURE
========================================================= */

function startReading(
    subject,
    text
){

    clearInterval(timer);
    clearInterval(readingTimer);

    show("reading");

    $("rtitle").textContent=
        subject==="Français"
        ?
        "Lecture — Français"
        :
        "Reading — English";

    $("rtext").textContent=text;

    readRemaining=900;

    updateRead();

    $("skip").onclick=()=>{

        clearInterval(
            readingTimer
        );

        readDone[subject]=true;

        render();

    };

    readingTimer=setInterval(()=>{

        readRemaining--;

        updateRead();

        if(readRemaining<=0){

            clearInterval(
                readingTimer
            );

            readDone[subject]=true;

            render();
        }

    },1000);
}


function updateRead(){

    $("rtimer").textContent=
        String(
            Math.floor(
                readRemaining/60
            )
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            readRemaining%60
        ).padStart(2,"0");
}


/* =========================================================
   AFFICHAGE QUESTION
========================================================= */

function render(){

    clearInterval(timer);

    show("quiz");

    let q=order[current];

    $("progress").textContent=
        "Question "
        +
        (current+1)
        +
        " / 100";

    $("subject").textContent=q.s;

    $("question").textContent=q.q;

    $("fill").style.width=
        (current+1)+"%";

    $("options").innerHTML="";

    q.choices.forEach(
        (choice,pos)=>{

            let button=
                document.createElement(
                    "button"
                );

            button.className=
                "option"
                +
                (
                    answers[current]===choice.k
                    ?
                    " selected"
                    :
                    ""
                );

            button.textContent=
                String.fromCharCode(
                    65+pos
                )
                +
                ". "
                +
                choice.text;

            button.onclick=()=>{

                answers[current]=
                    choice.k;

                renderOptions();

                renderNav();

            };

            $("options").appendChild(
                button
            );

        }
    );

    renderNav();

    startTimer();
}


/* =========================================================
   REPONSE
========================================================= */

function renderOptions(){

    let q=order[current];

    [
        ...$("options").children
    ].forEach(
        (button,pos)=>{

            button.classList.toggle(
                "selected",
                answers[current]
                ===
                q.choices[pos].k
            );

        }
    );
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(timer);

    remaining=60;

    updateTimer();

    timer=setInterval(()=>{

        remaining--;

        updateTimer();

        if(remaining<=0){

            clearInterval(timer);

            next();

        }

    },1000);
}


function updateTimer(){

    $("timer").textContent=
        "00:"
        +
        String(remaining)
        .padStart(2,"0");
}


/* =========================================================
   NAVIGATION
========================================================= */

function next(){

    clearInterval(timer);

    if(current<99){

        current++;

        route();

    }else{

        finish();

    }
}


$("next").onclick=next;


$("prev").onclick=()=>{

    if(current>0){

        clearInterval(timer);

        current--;

        route();

    }

};


function renderNav(){

    $("nav").innerHTML="";

    order.forEach(
        (q,n)=>{

            let button=
                document.createElement(
                    "button"
                );

            button.className=
                "qbtn"
                +
                (
                    answers[n]!==null
                    ?
                    " done"
                    :
                    ""
                )
                +
                (
                    n===current
                    ?
                    " current"
                    :
                    ""
                );

            button.textContent=n+1;

            button.onclick=()=>{

                clearInterval(timer);

                current=n;

                route();

            };

            $("nav").appendChild(
                button
            );

        }
    );
}


/* =========================================================
   TEXTE PENDANT LES QUESTIONS
========================================================= */

$("showText").onclick=()=>{

    let q=order[current];

    if(!q.r){

        alert(
            "Cette question ne dépend pas d'un texte."
        );

        return;
    }

    $("mtitle").textContent=
        q.s==="Français"
        ?
        "Texte français"
        :
        "English text";

    $("mtext").textContent=q.r;

    $("modal").style.display="flex";
};


$("close").onclick=()=>{

    $("modal").style.display="none";

};


$("modal").onclick=e=>{

    if(e.target===$("modal")){

        $("modal").style.display="none";

    }

};


/* =========================================================
   RESULTATS
========================================================= */

function finish(){

    clearInterval(timer);

    clearInterval(readingTimer);

    let score=0;

    let by={

        "Culture générale":[0,0],

        "Français":[0,0],

        "English":[0,0],

        "Maths":[0,0]

    };

    let errors="";


    order.forEach(
        (q,n)=>{

            by[q.s][1]++;

            if(
                answers[n]===q.a
            ){

                score++;

                by[q.s][0]++;

            }else{

                let chosen=
                    "Aucune réponse";

                if(
                    answers[n]!==null
                ){

                    let c=
                        q.choices.find(
                            x=>
                            x.k
                            ===
                            answers[n]
                        );

                    if(c){

                        chosen=c.text;

                    }

                }

                errors+=`

<div class="error">

<b>Question ${n+1}</b>

<p>
${q.q}
</p>

<p>
<b>Ta réponse :</b>
${chosen}
</p>

<p>
<b>Bonne réponse :</b>
${q.o[q.a]}
</p>

</div>

`;

            }

        }
    );


    show("results");


    $("score").textContent=
        name
        +
        " — "
        +
        score
        +
        "/100 — "
        +
        score
        +
        "%";


    $("subjects").innerHTML=
        Object.entries(by)
        .map(
            ([s,v])=>
            `<span class="badge">
            ${s} : ${v[0]}/${v[1]}
            </span>`
        )
        .join("");


    $("errors").innerHTML=
        errors
        ||
        "<p>Aucune erreur. 100/100.</p>";

}

</script>
